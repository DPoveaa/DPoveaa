name: Update GitHub Stats

on:
  schedule:
    # Roda uma vez ao dia à meia-noite (UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Stats SVGs
        run: |
          mkdir -p assets
          curl -s -o assets/github-stats.svg \
            "https://github-readme-stats.vercel.app/api?username=DPoveaa&show_icons=true&theme=radical&include_all_commits=true"
          curl -s -o assets/top-langs.svg \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=DPoveaa&layout=compact&langs_count=10&theme=radical"

      - name: Commit and push changes if modified
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --staged --quiet; then
            echo "Nenhuma alteração detectada nos stats."
          else
            git commit -m "📊 Update GitHub stats - $(date '+%Y-%m-%d %H:%M')"
            git push
          fi
